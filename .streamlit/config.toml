[theme]
# stile editoriale: fondo crema, testo quasi nero, linee sottili (i PDF restano "Match day")
base = "light"
primaryColor = "#141413"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#f0eee6"
textColor = "#141413"
linkColor = "#141413"
borderColor = "#e3e0d4"
dataframeHeaderBackgroundColor = "#f0eee6"
font = "'Instrument Sans', sans-serif"
headingFont = "'Instrument Sans', sans-serif"
baseRadius = "10px"
showWidgetBorder = true

[server]
headless = true
# file in static/ serviti da /app/static/ (icone dei club per la schermata Home)
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# niente pulsante "Deploy" né menu tecnico per gli utenti dei club
toolbarMode = "minimal"
