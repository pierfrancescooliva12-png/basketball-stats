[theme]
base = "dark"
primaryColor = "#ff7a1a"
backgroundColor = "#0a0e15"
secondaryBackgroundColor = "#111722"
textColor = "#e8ecf3"
borderColor = "#1f2735"
dataframeHeaderBackgroundColor = "#161d2b"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
baseRadius = "10px"
showWidgetBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# niente pulsante "Deploy" né menu tecnico per gli utenti dei club
toolbarMode = "minimal"
