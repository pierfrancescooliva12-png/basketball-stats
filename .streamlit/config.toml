[theme]
# stile "Match day" dei report PDF: fondo grigio chiaro, riquadri bianchi, blu notte e arancio
base = "light"
primaryColor = "#ff7a1a"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#eef1f6"
textColor = "#1a2233"
linkColor = "#2a78d6"
borderColor = "#e3e8f0"
dataframeHeaderBackgroundColor = "#e9edf4"
font = "Barlow, sans-serif"
headingFont = "'Barlow Condensed', sans-serif"
baseRadius = "10px"
showWidgetBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# niente pulsante "Deploy" né menu tecnico per gli utenti dei club
toolbarMode = "minimal"
