# Render: Blueprint della piattaforma ASSIST (dashboard.render.com › New › Blueprint › questo repository).
# I Secrets (utenti, database, Modal) vanno in Environment › Secret Files con il nome secrets.toml:
# lo script di avvio li copia dove Streamlit li cerca. Ogni push su main (anche l'aggiornamento
# quotidiano dei dati) ripubblica il servizio.
services:
  - type: web
    name: assist
    runtime: python
    region: frankfurt          # Europa: più vicino ai club, dati nell'UE
    plan: starter              # 512 MB; se i log segnalano memoria esaurita passare a standard
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_URL
        value: https://app.assistscouting.com
