name: Verifica online

# Controlla che sito pubblico e piattaforma rispondano e abbiano la versione nuova
# (logo ΛSSIST sul sito, intro nuova sulla piattaforma). Non modifica il repository.
on:
  push:
    branches: [claude/basket-stats-analysis-tool-z0mcls]
    paths: [.github/workflows/verifica_online.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sito pubblico
        run: |
          set -u
          codice=$(curl -sS -L -o sito.html -w "%{http_code}" https://assistscouting.com)
          echo "assistscouting.com: HTTP $codice"
          if grep -q 'viewBox="0 0 3912 720"' sito.html; then echo "SITO: logo nuovo presente"; else echo "SITO: logo nuovo NON trovato"; fi
          curl -sS -o /dev/null -w "favicon: HTTP %{http_code}\n" https://assistscouting.com/favicon-32.png
      - name: Piattaforma
        run: |
          curl -sS -m 30 -w "\nhealth: HTTP %{http_code}\n" https://app.assistscouting.com/_stcore/health || true
          curl -sS -m 30 -o /dev/null -w "pagina: HTTP %{http_code}\n" https://app.assistscouting.com || true
      - name: Piattaforma nel browser
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          cat > prova.py <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1280, "height": 800})
              pg.goto("https://app.assistscouting.com", timeout=90000)
              trovato = {}
              for _ in range(60):
                  html = pg.content()
                  for f in pg.frames:
                      try:
                          html += f.content()
                      except Exception:
                          pass
                  trovato = {"intro nuova": "fr-raduna" in html,
                             "stile editoriale (crema)": "#faf9f5" in html.lower(),
                             "login": "accesso-barra" in html}
                  if all(trovato.values()):
                      break
                  pg.wait_for_timeout(2000)
              for k, v in trovato.items():
                  print(f"PIATTAFORMA: {k}: {'sì' if v else 'NO'}")
              b.close()
          EOF
          python prova.py
