name: Verifica online

# Controlla che sito pubblico e piattaforma rispondano e abbiano la versione nuova
# (logo ΛSSIST sul sito, intro nuova sulla piattaforma). Non modifica il repository.
on:
  push:
    branches: [claude/basket-stats-analysis-tool-z0mcls]
    paths: [.github/workflows/verifica_online.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cronaca_live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cronaca della partita in corso
        run: |
          pip install -q requests beautifulsoup4 lxml
          python - <<'EOF'
          import re, sys
          sys.path.insert(0, ".")
          from basket import scraper
          from basket.client import RateLimitedClient
          url = scraper.pbp_url("ita3_b_442", "ita3_b", "x2627")
          r = RateLimitedClient(min_interval=0, retries=2).get(url)
          h = r.text
          print("URL", url, "HTTP", r.status_code, "byte", len(h))
          for k in ("sticky-table", "play-by-play-content", "<table", "data-period", "Minuto"):
              print(k, h.count(k))
          from bs4 import BeautifulSoup
          soup = BeautifulSoup(h, "lxml")
          for t in soup.select("table")[:4]:
              print("TABELLA", t.get("class"), [th.get_text(strip=True) for th in t.select("thead th")], len(t.select("tbody tr")))
              for tr in t.select("tbody tr")[:3]:
                  print("  RIGA", str(tr)[:400])
          for f in soup.select("iframe"):
              print("IFRAME", f.get("src"), f.get("id"), f.get("class"))
          for sc in soup.select("script[src]"):
              src = sc.get("src", "")
              if "static.legapallacanestro.com/sites/default/files/js/" not in src:
                  print("SCRIPT", src)
          for k in ("livestats", "fibalivestats", "genius", "wh.geniussports", "diretta", "live", "matchcentre", "ajax", "json"):
              print("PAROLA", k, h.lower().count(k))
          for sc in soup.select("script:not([src])"):
              t = sc.get_text()
              if any(k in t.lower() for k in ("live", "play", "ajax", "json")):
                  print("SCRIPT INLINE", re.sub(r"\s+", " ", t)[:1200])
          corpo = soup.select_one("#main, .main-container, .region-content, main") or soup.body
          print("TESTO", re.sub(r"\s+", " ", corpo.get_text(" "))[:2500])
          for m in re.finditer(r"play-by-play|pbp", h):
              print("CONTESTO", re.sub(r"\s+", " ", h[max(0, m.start() - 200):m.start() + 300]))
          try:
              cr = scraper.parse_pbp(h); print("PARSE OK", len(cr["eventi"]))
          except Exception as e:
              print("PARSE ERRORE", type(e).__name__, e)
          EOF

  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sito pubblico
        run: |
          set -u
          codice=$(curl -sS -L -o sito.html -w "%{http_code}" https://assistscouting.com)
          echo "assistscouting.com: HTTP $codice"
          if grep -q 'viewBox="0 0 3912 720"' sito.html; then echo "SITO: logo nuovo presente"; else echo "SITO: logo nuovo NON trovato"; fi
          curl -sS -o /dev/null -w "favicon: HTTP %{http_code}\n" https://assistscouting.com/favicon-32.png
      - name: Piattaforma
        run: |
          curl -sS -m 30 -w "\nhealth: HTTP %{http_code}\n" https://app.assistscouting.com/_stcore/health || true
          curl -sS -m 30 -o /dev/null -w "pagina: HTTP %{http_code}\n" https://app.assistscouting.com || true
      - name: Piattaforma nel browser
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          cat > prova.py <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1280, "height": 800})
              pg.goto("https://app.assistscouting.com", timeout=90000)
              trovato = {}
              for _ in range(60):
                  html = pg.content()
                  for f in pg.frames:
                      try:
                          html += f.content()
                      except Exception:
                          pass
                  trovato = {"intro nuova": "fr-raduna" in html,
                             "stile editoriale (crema)": "#faf9f5" in html.lower(),
                             "login": "accesso-barra" in html}
                  if all(trovato.values()):
                      break
                  pg.wait_for_timeout(2000)
              for k, v in trovato.items():
                  print(f"PIATTAFORMA: {k}: {'sì' if v else 'NO'}")
              b.close()
          EOF
          python prova.py
