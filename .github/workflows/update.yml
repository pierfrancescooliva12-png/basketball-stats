name: Aggiornamento dati

on:
  # Due volte al giorno, tutti i giorni (si gioca anche il sabato, il mercoledì e in altri
  # giorni: anticipi, turni infrasettimanali):
  # - 22:17 UTC (23:17 ora solare, 00:17 ora legale): dopo le partite della sera, comprese
  #   quelle delle 20:45, così i risultati ci sono la sera stessa;
  # - 04:23 UTC (05:23 ora solare, 06:23 ora legale): rete di sicurezza per cronache pubblicate
  #   tardi e per il calendario (orari spostati), così la diretta parte all'ora giusta.
  # Minuti non tondi: GitHub ritarda di più le esecuzioni programmate allo scoccare dell'ora.
  # Il report agli abbonati resta settimanale (lunedì).
  schedule:
    - cron: "17 22 * * *"
    - cron: "23 4 * * *"
  # Avvio manuale dall'app/sito GitHub: Actions > Aggiornamento dati > Run workflow
  workflow_dispatch:
    inputs:
      campionati:
        description: "Campionati (es. ita2,ita3_a,ita3_b). Vuoto = tutti"
        required: false
        default: ""
      giornate:
        description: "Giornate (es. 1-2 oppure 1,3,5-7). Vuoto = tutte"
        required: false
        default: ""
      stagioni:
        description: "Stagioni (es. x2627,x2526). Vuoto = stagione corrente"
        required: false
        default: ""
      anagrafica:
        description: "Massimo giocatori di cui scaricare l'anagrafica"
        required: false
        default: "200"

permissions:
  contents: write

concurrency:
  group: aggiornamento-dati
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Installa dipendenze
        run: pip install -r requirements-update.txt

      # Solo i test dell'importazione bloccano l'aggiornamento: se il sito della lega cambia
      # struttura non si salvano dati sbagliati. Gli altri test non devono fermare i risultati.
      - name: Test del parser
        run: python -m pytest -q tests/test_scraper.py tests/test_scraper_db.py tests/test_pbp.py

      - name: Altri test
        id: altri_test
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Scarica le partite nuove
        id: update
        continue-on-error: true
        env:
          CAMPIONATI: ${{ inputs.campionati }}
          GIORNATE: ${{ inputs.giornate }}
          STAGIONI: ${{ inputs.stagioni }}
          ANAGRAFICA: ${{ inputs.anagrafica || '200' }}
        run: |
          ARGS=()
          if [ -n "$CAMPIONATI" ]; then ARGS+=(--campionati "$CAMPIONATI"); fi
          if [ -n "$GIORNATE" ]; then ARGS+=(--giornate "$GIORNATE"); fi
          RC=0
          for S in ${STAGIONI//,/ }; do
            # con 10" tra le richieste: al massimo 500 cronache arretrate per esecuzione
            python -m basket.update "${ARGS[@]}" --stagione "$S" --anagrafica 0 \
              --recupero-cronaca 500 || RC=1
          done
          if [ -z "$STAGIONI" ]; then python -m basket.update "${ARGS[@]}" --anagrafica 0 || RC=1; fi
          python -m basket.update --campionati "" --anagrafica "$ANAGRAFICA" || RC=1
          exit $RC

      # Affidabilità delle previsioni: validazione retrospettiva e registro delle previsioni
      # sulle partite non ancora giocate (fatte prima delle partite, poi confrontate)
      - name: Previsioni e validazione
        continue-on-error: true
        run: |
          if [ -f data/lnp.sqlite ]; then python -m basket.validazione --salva --registra; fi

      # Le foto dei giocatori restano sul sito LNP: qui si verifica solo che siano raggiungibili
      - name: Verifica foto dei giocatori
        continue-on-error: true
        run: |
          if [ -f data/lnp.sqlite ]; then python -m basket.scheda_giocatori --verifica 12; fi

      - name: Genera Excel di riepilogo
        run: |
          if [ -f data/lnp.sqlite ]; then python -m basket.export_excel; fi

      # Report PDF sulla prossima avversaria agli abbonati (solo se configurati i segreti
      # SMTP_HOST, SMTP_USER, SMTP_PASSWORD, MITTENTE e ABBONATI)
      - name: Invia report agli abbonati
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MITTENTE: ${{ secrets.MITTENTE }}
          ABBONATI: ${{ secrets.ABBONATI }}
        run: |
          # nelle esecuzioni automatiche il report parte solo il lunedì
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Report settimanale: solo il lunedì"; exit 0
          fi
          python -m basket.invio_email

      - name: Conserva i PDF generati
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: reports/pdf/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
            exit 0
          fi
          git commit -m "Dati aggiornati $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Le partite scaricate correttamente sono già salvate; il workflow risulta
      # comunque fallito (e GitHub invia una notifica) se qualche partita non è stata importata
      # o se un test non legato all'importazione non passa.
      - name: Esito aggiornamento
        if: steps.update.outcome == 'failure' || steps.altri_test.outcome == 'failure'
        run: |
          if [ "${{ steps.update.outcome }}" = "failure" ]; then
            echo "::error::Alcune partite non sono state importate: vedi il log del passo 'Scarica le partite nuove'"
          fi
          if [ "${{ steps.altri_test.outcome }}" = "failure" ]; then
            echo "::error::Dati aggiornati, ma alcuni test della piattaforma non passano: vedi il passo 'Altri test'"
          fi
          exit 1
